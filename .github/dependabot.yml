version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      action-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "terraform"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      terraform-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "gomod"
    directory: "/test"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      gomod-dependencies:
        patterns:
          - "*"
